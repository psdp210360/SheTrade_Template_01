<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Company01 Products</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    margin:20px;
}

.gallery{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.product{
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.product img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
}

.product img:hover{
    transform:scale(1.03);
}

#viewer{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:9999;
}

#viewer img{
    max-width:90%;
    max-height:90%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
</style>
</head>
<body>

<h1>Company01 Product Gallery</h1>

<div class="gallery" id="gallery"></div>

<div id="viewer" onclick="this.style.display='none'">
    <img id="viewerImg">
</div>

<script>

const gallery =
document.getElementById('gallery');

const baseURL =
'https://psdp-my.sharepoint.com/personal/hassan_psdp_onmicrosoft_com/Documents/shetrade/company01/assets/';

for(let i=1;i<=99;i++){

    let img=new Image();

    img.src=
      baseURL+
      'product'+i+'.jpeg';

    img.onload=function(){

        let card=
        document.createElement('div');

        card.className='product';

        card.innerHTML=
        `
        <img
        src="${img.src}"
        onclick="openViewer('${img.src}')">

        <p>Product ${i}</p>
        `;

        gallery.appendChild(card);
    };
}

function openViewer(src){

    document.getElementById('viewer')
      .style.display='block';

    document.getElementById('viewerImg')
      .src=src;
}

</script>

</body>
</html>
