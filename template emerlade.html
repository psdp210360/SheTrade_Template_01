<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFERNO | Feverish Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FF006E; --secondary: #FB5607; --accent: #FFBE0B; --bg: #0B0B0B; --ivory: #FFFAF0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--ivory); }
        header { background: rgba(11,11,11,0.98); backdrop-filter: blur(25px); position: fixed; width: 100%; z-index: 1000; border-bottom: 3px solid var(--primary); box-shadow: 0 5px 40px rgba(255,0,110,0.4); }
        .top-bar { background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent)); color: #000; text-align: center; padding: 12px; font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1500px; margin: 0 auto; padding: 22px 40px; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--primary); letter-spacing: 5px; text-shadow: 0 0 30px var(--primary); transition: all 0.4s; }
        .logo:hover { color: var(--accent); text-shadow: 0 0 50px var(--accent); transform: scale(1.05) skew(-2deg); }
        .nav-menu { display: flex; gap: 55px; list-style: none; }
        .nav-menu a { text-decoration: none; color: var(--ivory); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; position: relative; }
        .nav-menu a::before { content: ''; position: absolute; bottom: -5px; left: 50%; width: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: all 0.3s; transform: translateX(-50%); }
        .nav-menu a:hover { color: var(--accent); text-shadow: 0 0 15px var(--accent); }
        .nav-menu a:hover::before { width: 100%; }
        .cart-icon { position: relative; cursor: pointer; font-size: 28px; transition: all 0.3s; }
        .cart-icon:hover { color: var(--primary); transform: scale(1.2) rotate(10deg); }
        .cart-count { position: absolute; top: -12px; right: -14px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-radius: 50%; width: 26px; height: 26px; font-size: 13px; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 0 25px var(--primary); }
        .hero { margin-top: 118px; height: 85vh; background: radial-gradient(ellipse at center, #1A1A1A, var(--bg)); display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: 160px; line-height: 0.9; background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 8px; margin-bottom: 30px; }
        .btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; padding: 20px 55px; text-decoration: none; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; border: none; cursor: pointer; transition: all 0.4s; display: inline-block; border-radius: 50px; box-shadow: 0 10px 40px rgba(255,0,110,0.5); }
        .btn:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 20px 60px rgba(255,190,11,0.6); }
        .catalog { max-width: 1500px; margin: 0 auto; padding: 120px 40px; }
        .section-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 90px; background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 6px; margin-bottom: 20px; text-align: center; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 45px; margin-top: 60px; }
        .product { background: linear-gradient(145deg, #1A1A1A, #2A2A2A); border: 2px solid transparent; position: relative; overflow: hidden; transition: all 0.5s; border-radius: 20px; }
        .product:hover { transform: translateY(-15px) scale(1.03); box-shadow: 0 30px 80px rgba(255,0,110,0.5); }
        .product-image { position: relative; overflow: hidden; height: 400px; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .product:hover .product-image img { transform: scale(1.15) rotate(3deg); }
        .product-info { padding: 32px; }
        .product-name { font-size: 24px; font-weight: 700; color: var(--ivory); margin-bottom: 10px; }
        .product:hover .product-name { color: var(--accent); }
        .product-desc { color: #888; font-size: 14px; margin-bottom: 22px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 22px; border-top: 1px solid rgba(255,255,255,0.1); }
        .product-price { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .add-to-cart { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 14px 28px; border-radius: 50px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .add-to-cart:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(255,190,11,0.6); }
        .cart-sidebar { position: fixed; top: 0; right: -500px; width: 500px; height: 100vh; background: linear-gradient(180deg, #1A1A1A, var(--bg)); z-index: 2000; transition: 0.5s; display: flex; flex-direction: column; border-left: 4px solid var(--primary); box-shadow: -15px 0 60px rgba(255,0,110,0.6); }
        .cart-sidebar.active { right: 0; }
        .cart-header { padding: 35px; border-bottom: 3px solid var(--primary); display: flex; justify-content: space-between; align-items: center; background: rgba(255,0,110,0.1); }
        .cart-header h3 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--primary); letter-spacing: 3px; }
        .close-cart { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; color: #fff; }
        .cart-items { flex: 1; overflow-y: auto; padding: 30px; }
        .cart-item { display: flex; gap: 20px; margin-bottom: 25px; padding: 20px; background: #2A2A2A; border-radius: 15px; border-left: 4px solid var(--secondary); }
        .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; }
        .cart-item-info h4 { font-size: 16px; margin-bottom: 8px; }
        .cart-item-price { color: var(--accent); font-weight: 700; font-size: 18px; margin-bottom: 10px; }
        .qty-controls { display: flex; gap: 12px; align-items: center; }
        .qty-btn { background: var(--primary); border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: 900; }
        .cart-footer { padding: 35px; border-top: 3px solid var(--primary); background: rgba(255,0,110,0.05); }
        .cart-total { display: flex; justify-content: space-between; font-size: 28px; font-weight: 900; margin-bottom: 25px; color: var(--accent); }
        .checkout-btn { width: 100%; background: linear-gradient(135deg, #25D366, #1ebe5d); color: #fff; padding: 20px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; font-size: 16px; letter-spacing: 1.5px; border-radius: 50px; }
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1999; display: none; }
        .cart-overlay.active { display: block; }
        .empty-cart { text-align: center; padding: 80px 20px; color: #666; }
        @media (max-width: 768px) { .nav-menu { display: none; } .hero h1 { font-size: 70px; } .products { grid-template-columns: 1fr; } .cart-sidebar { width: 100%; right: -100%; } }
    </style>
</head>
<body>
    <div class="cart-overlay" onclick="toggleCart()"></div>
    <header>
        <div class="top-bar">🔥 INFERNO SALE - FREE SHIPPING OVER $200 🔥</div>
        <nav>
            <div class="logo">INFERNO</div>
            <ul class="nav-menu">
                <li><a href="#home">Home</a></li>
                <li><a href="#catalog">Collection</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-fire"></i>
                <span class="cart-count">0</span>
            </div>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-content">
            <h1>Ignite Your<br><span>Space</span></h1>
            <p>Artisan pieces forged in creativity. No beige. No boring. Just pure inferno.</p>
            <a href="#catalog" class="btn">Enter The Inferno</a>
        </div>
    </section>

    <section class="catalog" id="catalog">
        <div class="section-header">
            <h2>Inferno Collection</h2>
            <p>Handcrafted pieces that set your space ablaze</p>
        </div>
        <div class="products" id="productsGrid"></div>
    </section>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Burn Basket</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total"><span>Total:</span><span id="cartTotal">$0.00</span></div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()"><i class="fab fa-whatsapp"></i> Checkout via WhatsApp</button>
        </div>
    </div>

    <script>
        const whatsappNumber = '201001234433';
        const products = [
            {id: 1, name: "Ombre Stone Table Lamp", price: 189.99, img: "product1.jpeg", desc: "Handwoven rattan shade on ceramic base"},
            {id: 2, name: "Amber Gemstone Wire Tree", price: 149.00, img: "product2.jpeg", desc: "Handcrafted wire tree with amber stones"},
            {id: 3, name: "Ethnic Diamond Pillow", price: 79.50, img: "product3.jpeg", desc: "Linen pillow with tribal embroidery"},
            {id: 4, name: "Copper Wire Stone Ring", price: 65.00, img: "product4.jpeg", desc: "Artisan wrapped crystal ring"},
            {id: 5, name: "Cerulean Ceramic Vase", price: 95.00, img: "product5.jpeg", desc: "Minimalist blue glazed vase"},
            {id: 7, name: "Desert Wool Tapestry", price: 129.00, img: "product7.jpeg", desc: "Handwoven wool wall hanging"},
            {id: 9, name: "Sky Blue Hoop Earrings", price: 55.00, img: "product9.jpeg", desc: "Silver hoops with fabric flowers"},
            {id: 10, name: "Watercolor Ceramic Bottle", price: 89.00, img: "product10.jpeg", desc: "Artisan painted ceramic decor"},
            {id: 11, name: "Boho Macrame Planter", price: 45.00, img: "product11.jpeg", desc: "Hand-knotted cotton hanging planter"},
            {id: 12, name: "Turquoise Wire Tree", price: 159.00, img: "product12.jpeg", desc: "Gemstone tree on walnut base"},
        ];
        let cart = [];
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `<div class="product"><div class="product-image"><img src="assets/${p.img}" alt="${p.name}" loading="lazy"></div><div class="product-info"><h3 class="product-name">${p.name}</h3><p class="product-desc">${p.desc}</p><div class="product-footer"><div class="product-price">$${p.price}</div><button class="add-to-cart" onclick="addToCart(${p.id})"><i class="fas fa-fire"></i> Add</button></div></div></div>`;
            });
        }
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty++; } else { cart.push({ ...product, qty: 1 }); }
            updateCart();
            document.getElementById('cartSidebar').classList.add('active');
            document.querySelector('.cart-overlay').classList.add('active');
        }
        function removeFromCart(id) { cart = cart.filter(item => item.id !== id); updateCart(); }
        function updateQty(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) { item.qty += delta; if (item.qty <= 0) removeFromCart(id); else updateCart(); }
        }
        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartCount = document.querySelector('.cart-count');
            const cartTotal = document.getElementById('cartTotal');
            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart"><i class="fas fa-fire"></i><p>Your basket is empty</p></div>';
                cartCount.textContent = '0';
                cartTotal.textContent = '$0.00';
                return;
            }
            cartItems.innerHTML = '';
            let total = 0, count = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                cartItems.innerHTML += `<div class="cart-item"><img src="assets/${item.img}" alt="${item.name}"><div class="cart-item-info"><h4>${item.name}</h4><div class="cart-item-price">$${item.price}</div><div class="qty-controls"><button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button><span>x${item.qty}</span><button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button></div></div><button class="cart-item-remove" onclick="removeFromCart(${item.id})"><i class="fas fa-trash"></i></button></div>`;
            });
            cartCount.textContent = count;
            cartTotal.textContent = `$${total.toFixed(2)}`;
        }
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('active');
            document.querySelector('.cart-overlay').classList.toggle('active');
        }
        function checkoutWhatsApp() {
            if (cart.length === 0) { alert('Your basket is empty!'); return; }
            let message = `🔥 INFERNO ORDER 🔥%0A%0A`;
            let subtotal = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                message += `${index + 1}. *${item.name}*%0A   Qty: ${item.qty} x $${item.price} = $${itemTotal.toFixed(2)}%0A%0A`;
            });
            const shipping = subtotal >= 200 ? 0 : 25;
            const total = subtotal + shipping;
            message += `*Subtotal:* $${subtotal.toFixed(2)}%0A*Shipping:* $${shipping.toFixed(2)} ${shipping === 0 ? '(FREE)' : ''}%0A*━━━━━━━━━━━━━━━━*%0A*🔥 TOTAL: $${total.toFixed(2)}*%0A%0A*Customer Details:*%0AName: %0APhone: %0AAddress: %0A%0APlease confirm my order!`;
            window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
        }
        renderProducts();
    </script>
</body>
</html>
